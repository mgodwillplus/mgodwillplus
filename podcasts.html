<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070d"
  >

  <meta
    name="description"
    content="MGodwill+ Podcasts — conversations, ideas and spoken-word productions."
  >

  <title>Podcasts — MGodwill+</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body data-page="podcasts">

  <!-- CINEMATIC LOADER -->
  <div
    id="page-loader"
    class="page-loader"
  >
    <div class="loader-brand">
      <span class="loader-plus">M</span>
      <span>GODWILL+</span>
    </div>

    <div class="loader-line">
      <span></span>
    </div>
  </div>


  <!-- HEADER -->
  <div id="site-header"></div>


  <!-- MAIN -->
  <main>

    <!-- HERO -->
    <section class="page-hero">

      <div class="page-hero-content">

        <span class="eyebrow">
          MGODWILL+ AUDIO
        </span>

        <h1>
          Podcasts
        </h1>

        <p>
          Conversations, ideas, reflections
          and spoken-word productions.
        </p>

      </div>

    </section>


    <!-- PODCAST LIBRARY -->
    <section class="content-section">

      <div class="section-heading">

        <div>

          <span class="eyebrow">
            THE ARCHIVE
          </span>

          <h2>
            Listen
          </h2>

        </div>

        <span
          id="podcast-count"
          class="section-count"
        ></span>

      </div>


      <div
        id="podcast-grid"
        class="media-grid"
      ></div>

    </section>


    <!-- FEATURED PODCAST -->
    <section class="content-section">

      <div class="section-heading">

        <div>

          <span class="eyebrow">
            FEATURED
          </span>

          <h2>
            From the archive
          </h2>

        </div>

      </div>


      <div
        id="podcast-featured"
        class="music-feature"
      ></div>

    </section>


    <!-- JOURNAL CROSSOVER -->
    <section class="content-section">

      <div class="cta-panel">

        <span class="eyebrow">
          WORDS
        </span>

        <h2>
          Some ideas deserve to be read.
        </h2>

        <p>
          Enter the MGodwill+ Journal for
          essays, reflections and written work.
        </p>

        <div class="cta-actions">

          <a
            class="btn btn-primary"
            href="journal.html"
          >
            Open Journal
          </a>

          <a
            class="btn btn-secondary"
            href="index.html"
          >
            Back Home
          </a>

        </div>

      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <div id="site-footer"></div>


  <!-- SCRIPTS -->
  <script src="catalogue.js"></script>
  <script src="app.js"></script>

</body>
      </html>
