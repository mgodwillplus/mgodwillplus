<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#05070d"
  >

  <meta
    name="description"
    content="MGodwill+ Music — songs, audio productions and musical experiments."
  >

  <title>Music — MGodwill+</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body data-page="music">

  <!-- CINEMATIC LOADER -->
  <div
    id="page-loader"
    class="page-loader"
  >
    <div class="loader-brand">
      <span class="loader-plus">M</span>
      <span>GODWILL+</span>
    </div>

    <div class="loader-line">
      <span></span>
    </div>
  </div>


  <!-- HEADER -->
  <div id="site-header"></div>


  <!-- MAIN -->
  <main>

    <!-- HERO -->
    <section class="page-hero">

      <div class="page-hero-content">

        <span class="eyebrow">
          MGODWILL+ AUDIO
        </span>

        <h1>
          Music
        </h1>

        <p>
          Songs, experiments and sounds
          from the MGodwill+ archive.
        </p>

      </div>

    </section>


    <!-- FEATURED MUSIC -->
    <section class="content-section">

      <div class="section-heading">

        <div>

          <span class="eyebrow">
            FEATURED
          </span>

          <h2>
            Enter the sound
          </h2>

        </div>

      </div>


      <div
        id="music-featured"
        class="music-feature"
      ></div>

    </section>


    <!-- MUSIC LIBRARY -->
    <section class="content-section">

      <div class="section-heading">

        <div>

          <span class="eyebrow">
            AUDIO LIBRARY
          </span>

          <h2>
            All Music
          </h2>

        </div>

        <span
          id="music-count"
          class="section-count"
        ></span>

      </div>


      <div
        id="music-grid"
        class="media-grid"
      ></div>

    </section>


    <!-- PODCAST CROSSOVER -->
    <section class="content-section">

      <div class="cta-panel">

        <span class="eyebrow">
          MORE AUDIO
        </span>

        <h2>
          Prefer conversations?
        </h2>

        <p>
          Explore the MGodwill+ podcast archive
          and listen to longer-form audio.
        </p>

        <div class="cta-actions">

          <a
            class="btn btn-primary"
            href="podcasts.html"
          >
            Explore Podcasts
          </a>

          <a
            class="btn btn-secondary"
            href="index.html"
          >
            Back Home
          </a>

        </div>

      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <div id="site-footer"></div>


  <!-- SCRIPTS -->
  <script src="catalogue.js"></script>
  <script src="app.js"></script>

</body>
        </html>
