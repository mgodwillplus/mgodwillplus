<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MGodwill+</title>
<meta name="description" content="MGodwill+ is a creative catalogue of film, music, audio, podcasts and writing.">
<meta name="theme-color" content="#050a14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23050a14'/%3E%3Ccircle cx='50' cy='50' r='38' fill='none' stroke='%2322d3ee' stroke-width='6'/%3E%3Ctext x='50' y='64' text-anchor='middle' font-family='Arial' font-weight='700' font-size='40' fill='white'%3EM+%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
/* Show the intro once per browser session; skip for reduced-motion users. */
try{if(!sessionStorage.getItem('mg_intro')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('intro-on');sessionStorage.setItem('mg_intro','1')}}catch(e){}
</script>
</head>
<body data-page="home">
<div id="intro" aria-hidden="true">
  <div class="iglow"></div>
  <div class="istack">
    <svg class="imono" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="44" stroke="#22d3ee" stroke-width="3"/><text x="50" y="64" text-anchor="middle" font-family="'Bebas Neue',Impact,sans-serif" font-size="46" fill="#fff" letter-spacing="2">M+</text></svg>
    <div class="iword">MGODWILL+</div>
  </div>
  <button class="iskip" type="button">Skip</button>
</div>
<main id="app"><noscript><p class="empty">MGodwill+ needs JavaScript to show the catalogue.</p></noscript></main>
<script src="catalogue.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
